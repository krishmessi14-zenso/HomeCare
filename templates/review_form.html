{% extends "base.html" %}{% from "_macros.html" import csrf %}{% block title %}Review{% endblock %}
{% block content %}<div class="container mt-4"><div class="row justify-content-center"><div class="col-md-7 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4">
<h3 class="text-hc">Review: {{ booking.service_name }}</h3><p class="text-muted">{{ booking.booking_date|pretty_date }}, {{ booking.booking_time }}</p>
<form method="post">{{ csrf() }}<div class="mb-3"><label class="form-label" for="rating">Rating</label><select class="form-select" id="rating" name="rating" required><option value="">Choose…</option>
{% for i in [5,4,3,2,1] %}<option value="{{ i }}">{{ i }} – {{ ['','Poor','Fair','Good','Very good','Excellent'][i] }}</option>{% endfor %}</select></div>
<div class="mb-3"><label class="form-label" for="comment">Comment</label><textarea class="form-control" id="comment" name="comment" rows="4" maxlength="1000"></textarea></div>
<button class="btn btn-hc">Submit review</button> <a class="btn btn-link" href="{{ url_for('customer.dashboard') }}">Cancel</a></form></div></div></div></div></div>{% endblock %}
