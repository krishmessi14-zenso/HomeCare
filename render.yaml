services:
  - type: web
    name: homecare
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT "app:create_app()"
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: homecare
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
